name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

on:
  push:
    branches: ["main", "master", "dev"]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: ["*"]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["v2.12.2"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        id: setup-go
        uses: ./.github/actions/setup-go
        with:
          install-dependencies: "false"

      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted correctly:"
            echo "$unformatted"
            echo "Please run 'gofmt -w .' locally to fix them."
            exit 1
          fi

      - name: Cache golangci-lint binary
        id: cache-golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-golangci-lint-${{ matrix.version }}

      - name: Install golangci-lint
        if: steps.cache-golangci-lint.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ matrix.version }}

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run --config=.golangci.yml

  vulncheck:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["v1.8.0"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        id: setup-go
        uses: ./.github/actions/setup-go
        with:
          install-dependencies: "false"

      - name: Cache govulncheck binary
        id: cache-govulncheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin/govulncheck
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-govulncheck-${{ matrix.version }}

      - name: Install govulncheck
        if: steps.cache-govulncheck.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ matrix.version }}

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build Project
        run: go build -v ./cmd/tusshi

      - name: Run Unit Tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate Coverage Summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "No coverage file found." >> $GITHUB_STEP_SUMMARY
          fi
