version: 2
updates:
  # GitHub Actions (auto-bump pinned commit SHAs)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions:
        patterns:
          - "*"

  # Go modules
  - package-ecosystem: "go-mod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      charm:
        patterns:
          - "github.com/charmbracelet/*"
          - "github.com/muesli/*"
          - "github.com/mattn/go-*"
        update-types: ["minor", "patch"]
      golang-x:
        patterns:
          - "golang.org/x/*"
        update-types: ["minor", "patch"]